name: AI Code Review
on:
  pull_request:
    types:
      - opened
      - synchronize
  issue_comment:
    types:
      - created
permissions: write-all
jobs:
  code_review:
    runs-on: ubuntu-latest
    steps:
      # 注意：本 action 纯 API 工作无需 checkout 仓库

      # --- Choose ONE of the following provider configurations ---

      # Option 1: OpenAI
      # - name: AI Code Review (OpenAI)
      #   uses: GuessWhoIAm-MyGithub/My-ai-code-reviewer@main
      #   with:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     API_PROVIDER: "openai"
      #     API_MODEL: "gpt-4"
      #     exclude: "yarn.lock,dist/**"

      # Option 2: Anthropic Claude
      - name: AI Code Review (Anthropic)
        uses: GuessWhoIAm-MyGithub/My-ai-code-reviewer@latest
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          API_PROVIDER: "anthropic"
          API_MODEL: ${{ secrets.MODEL_NAME }}
          API_BASE_URL: ${{ secrets.BASE_URL }}
          MAX_TOKENS: "131072"
          exclude: "*.lock,dist/**"

      # Option 3: Google Gemini
      # - name: AI Code Review (Gemini)
      #   uses: GuessWhoIAm-MyGithub/My-ai-code-reviewer@main
      #   with:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     API_PROVIDER: "gemini"
      #     API_MODEL: "gemini-pro"
      #     exclude: "yarn.lock,dist/**"
